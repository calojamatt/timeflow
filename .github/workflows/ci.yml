name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Flutter app does not exist yet (Phase 0)
        if: hashFiles('app/pubspec.yaml') == ''
        run: |
          echo "app/ not created yet (Phase 0). Nothing to build."

      - uses: subosito/flutter-action@v2
        if: hashFiles('app/pubspec.yaml') != ''
        with:
          channel: stable
          flutter-version: 3.24.0

      - name: Install dependencies
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter pub get

      - name: Format check
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: dart analyze

      - name: Test
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter test
