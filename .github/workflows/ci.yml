name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Flutter app does not exist yet (Phase 0)
        if: hashFiles('app/pubspec.yaml') == ''
        run: |
          echo "app/ not created yet (Phase 0). Nothing to build."

      - uses: subosito/flutter-action@v2
        if: hashFiles('app/pubspec.yaml') != ''
        with:
          channel: stable
          flutter-version: 3.47.5

      - name: Install dependencies
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter pub get

      - name: Format check
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: dart analyze

      - name: Test
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter test

      - name: Integration tests
        if: hashFiles('app/pubspec.yaml') != ''
        working-directory: app
        run: flutter test $(find test -name '*_it.dart')

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeflow-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
